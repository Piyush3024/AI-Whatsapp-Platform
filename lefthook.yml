
pre-commit:
  commands:
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: pnpm check-types
    lint:
      glob: "**/*.{ts,tsx}"
      run: pnpm lint

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    build:
      run: pnpm --filter web build