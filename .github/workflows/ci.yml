name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.0.0"

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # needed for turbo to detect changed packages

      # ── Setup pnpm ──────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # ── Setup Node ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # ── Cache turbo ─────────────────────────────────────────────────────────
      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Generate Prisma client ───────────────────────────────────────────────
      - name: Generate Prisma client
        run: pnpm db:generate

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm lint

      # ── Typecheck ───────────────────────────────────────────────────────────
      - name: Typecheck
        run: pnpm check-types

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build
        run: pnpm build
        env:
          # Minimal env vars needed for Next.js build to succeed
          # Real secrets are NOT needed for build — only for runtime
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_SENTRY_DSN: ""
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          SKIP_ENV_VALIDATION: true
